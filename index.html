<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Tema antes da 1ª pintura (sem piscar branco no escuro). Mesma regra de
      // src/lib/tema.ts: preferência do aparelho, padrão = seguir o sistema.
      (function () {
        try {
          var p = localStorage.getItem("gerentia.tema");
          var escuro =
            p === "escuro" ||
            (p !== "claro" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="description"
      content="gerentia.app — Organize as finanças por centro de custo e tome decisões melhores, direto do WhatsApp."
    />
    <title>gerentia.app</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
